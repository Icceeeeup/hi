<!DOCTYPE html>
<html lang="en">
<head>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .Qr {
            text-align: center;
            margin: 20px 0;
        }
        .checkout {
            background: rgba(12, 1, 17, 0.658);
            border: 2px solid #b001b4;
            border-radius: 10px;
            padding: 20px;
            width: 300px;
            margin: 50px auto;
            box-shadow: 0 0 20px #ff00ff;
        }

        .checkout h2 {
            margin: 0 auto;
            text-align: center;
            color: #b001b4;
        } 

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
            outline: none;
            background-color: #e0d7d7;
            color: #000000;
        }

        .submit-btn {
            margin-top: 20px;
            align-items: center;
            padding: 12px;
            background-color: #b001b4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-btn:hover {
            background-color: #ff00ff;
        }
    </style>
</head>
<body>
    <header class="Menu">
        <div class="company-name">
            <img src="./resource/AMBA.png" height="100px" alt="Logo">
            <h1>AMBA Game</h1>
        </div>
        <nav class="nav-links">
            <div>
                <a href="./home.html">Home</a>
                <a href="./about.html">About</a>
                <a href="./shop.html">Shop Now</a>
                <a href="./contact.html">Contact us</a>

            </div>
        </nav>
    </header>
    <div class="Qr">
        <h2>Scan the QR code to pay</h2>
        <img src="./resource/qr.jpg" alt="QR Code" width="200" height="200">
    </div>
    <div class="checkout">
        <h2>Checkout</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone number">Phone Number:</label>
            <input type="number" id="phone number" name="phone number"  required><br><br>

            <label for="address">Address:</label>
            <textarea id="address" name="address" required></textarea><br><br>

            <label for="add screenshot">Add Screenshot:</label>
            <input type="file" id="add screenshot" name="screenshot" accept="image/*">

            <button type="submit" class="submit-btn">
                Submit
            </button>
        </form>
    </div>
    <footer class="footer">
        <p>&copy; 2026 AMBA Game. All rights reserved.</p>
    </footer>
</body>
</html>
